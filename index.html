<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff4f98">
<title>Shadman &amp; Nanziba Forever 💗</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,sans-serif}
body{min-height:100svh;overflow:hidden;color:#75103f;background:linear-gradient(145deg,#ffc6dc,#ff78ad,#ffd4e5);background-size:300% 300%;animation:bg 9s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
button{border:0;border-radius:999px;min-width:112px;padding:14px 22px;font-size:1.08rem;font-weight:900;box-shadow:0 7px 17px #9c205033;font-family:inherit}

#floaties{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.floaty{position:absolute;bottom:-12vh;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-125vh) rotate(35deg);opacity:0}}

/* ENVELOPE INTRO */
#intro{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;transition:opacity .6s,transform .6s}
#intro.gone{opacity:0;transform:scale(1.6);pointer-events:none}
.env{position:relative;width:min(72vw,280px);aspect-ratio:3/2;background:#fff;border-radius:14px;box-shadow:0 18px 45px #9b145355;animation:bob 2s ease-in-out infinite alternate}
.env:before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,#ffe3ee,#fff);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env:after{content:"";position:absolute;left:0;right:0;top:0;height:58%;background:#ffd0e2;border-radius:14px 14px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 2px #9b145333)}
.seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:2.6rem;z-index:2;animation:beat .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-12px) rotate(-2deg)}}
@keyframes beat{to{transform:translate(-50%,-50%) scale(1.25)}}
.tap{font-weight:900;font-size:1.15rem;letter-spacing:.5px;animation:fade 1.2s ease-in-out infinite alternate}
@keyframes fade{from{opacity:.45}}

/* QUESTION */
.card{position:fixed;width:min(91vw,440px);left:50%;top:50%;transform:translate(-50%,-50%);padding:30px 19px;text-align:center;border:2px solid #fff;border-radius:30px;background:#ffffffdf;box-shadow:0 18px 55px #9b145344;z-index:2;display:none}
.card.show{display:block;animation:cardIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%)}}
h1{font-size:clamp(1.65rem,7.5vw,2.2rem);line-height:1.18;font-weight:900;margin:18px 0}
.button-zone{min-height:110px;display:flex;align-items:center;justify-content:center;gap:13px;position:relative}
#yes{background:linear-gradient(135deg,#ff3d8b,#e81970);color:#fff;cursor:pointer;transition:transform .25s;animation:throb 1.4s ease-in-out infinite alternate}
@keyframes throb{to{box-shadow:0 0 0 9px #ff3d8b33,0 7px 17px #9c205033}}
#no{background:#ffe3ee;color:#9e285c;position:relative;transition:transform .15s ease}
.note{font-size:.92rem;color:#a64b73;min-height:2.6em;margin:6px 0 0}

/* CELEBRATION */
#yay{display:none;position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:radial-gradient(circle at 50% 30%,#ff9ec6,#ff4c96 60%,#d9227a);color:#fff;text-align:center;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 15px 95px;z-index:5}
#yay .content{margin:auto 0;display:flex;flex-direction:column;align-items:center}
#yay h2{font-size:clamp(1.9rem,8.5vw,3.6rem);font-weight:900;line-height:1.05;margin:12px 0 6px;text-shadow:3px 4px 0 #a30d58,0 0 20px #fff;animation:pop .65s ease both}
@keyframes pop{from{opacity:0;transform:scale(.25) rotate(-10deg)}to{opacity:1;transform:scale(1)}}
.dance{font-size:clamp(2.2rem,11vw,3.6rem);animation:dance .48s ease-in-out infinite alternate}
@keyframes dance{to{transform:translateY(-12px) rotate(10deg) scale(1.1)}}
.polaroid{display:none;width:min(72vw,310px);background:#fff;padding:10px 10px 12px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 14px 38px #7a0a45aa;margin:10px 0 4px;animation:drop 1s cubic-bezier(.2,1.3,.4,1) .2s both}
@keyframes drop{from{opacity:0;transform:translateY(-120%) rotate(14deg)}to{opacity:1;transform:rotate(-3deg)}}
.polaroid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:2px}
.polaroid p{margin:8px 0 0;color:#b4195f;font-family:"Segoe Script","Bradley Hand",cursive;font-size:1.15rem;font-weight:700}
.tape{position:absolute;top:-14px;left:50%;width:90px;height:26px;background:#ffe27acc;transform:translateX(-50%) rotate(3deg)}
.names{font-weight:900;font-size:clamp(1.25rem,5.5vw,2rem);text-shadow:2px 3px 0 #a30d58;margin-top:6px}
.infinity{font-size:clamp(2.8rem,14vw,4.6rem);line-height:1;color:#fff36b;text-shadow:3px 4px #b40e60;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18) rotate(-8deg)}}
#msg{max-width:340px;min-height:6.5em;margin:10px 0 0;padding:14px 16px;background:#ffffff26;border:1px solid #ffffff77;border-radius:18px;font-size:1.02rem;line-height:1.5;font-weight:600;backdrop-filter:blur(3px)}
#msg b{display:block;margin-top:6px;font-family:"Segoe Script","Bradley Hand",cursive}
.small{font-size:.95rem;font-weight:800;margin-top:12px;opacity:.95}

#musicToggle{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#fff;color:#e81970;padding:13px 25px;min-width:175px;font-size:14px;z-index:20;cursor:pointer;box-shadow:0 5px 20px #9b145366}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
.pop{position:fixed;pointer-events:none;z-index:14;font-size:26px;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--dx),-170px) scale(1.5);opacity:0}}

@media(max-width:360px){.card{padding:24px 14px}h1{font-size:1.55rem}button{min-width:100px;padding:12px 18px}}
@media(max-height:650px){.card{padding:20px 15px}h1{margin:10px 0}}
</style>
</head>

    <div id="msg"></div>

</section>

<script>
const $=id=>document.getElementById(id);
const bgm=$('bgm'),toggle=$('musicToggle');

/* floating hearts */
const layer=$('floaties'),emo=['💗','💖','💕','💘','💓','❤️','💋','😘'];
for(let i=0;i<30;i++){const e=document.createElement('span');e.className='floaty';e.textContent=emo[i%emo.length];
 e.style.left=Math.random()*100+'%';e.style.fontSize=(17+Math.random()*25)+'px';
 e.style.animationDuration=(7+Math.random()*9)+'s';e.style.animationDelay=(-Math.random()*15)+'s';layer.appendChild(e);}

/* music */
function playMusic(){bgm.play().catch(()=>{});toggle.innerText='🎵 PAUSE MUSIC';}
toggle.addEventListener('click',e=>{e.stopPropagation();if(bgm.paused)playMusic();else{bgm.pause();toggle.innerText='🎵 PLAY MUSIC';}});

/* envelope */
$('intro').addEventListener('click',()=>{
  playMusic();
  $('intro').classList.add('gone');
  setTimeout(()=>{$('intro').style.display='none';$('question').classList.add('show');},450);
});

/* NO button gets sneakier */
const no=$('no'),yes=$('yes'),note=$('note');
const lines=['My heart already knows your answer… 🥹','Oops, missed it! 🙈','Nice try 😏','The NO button is shy 🥺','Are you sure? Think again 💭','Almost there… 😭','Fine, it gives up! Press it 💘'];
let tries=0,last=0;
function dodge(e){
  if(e&&e.cancelable)e.preventDefault();
  if(tries>=lines.length-1){if(e&&e.type==='click')sayYes();return;}
  const t=Date.now();if(t-last<350)return;last=t;
  tries++;
  const mx=Math.min(135,innerWidth*.3);
  no.style.transform=`translate(${(Math.random()*2-1)*mx}px,${(Math.random()*2-1)*80}px) rotate(${(Math.random()*2-1)*14}deg)`;
  yes.style.transform=`scale(${1+tries*.1})`;
  note.textContent=lines[tries];
  if(tries>=lines.length-1){no.textContent='YES 💖';no.style.background='linear-gradient(135deg,#ff3d8b,#e81970)';no.style.color='#fff';no.style.transform='none';}
}
['pointerenter','pointerdown','click','focus'].forEach(v=>no.addEventListener(v,dodge));
no.addEventListener('touchstart',dodge,{passive:false});

/* confetti */
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(n,x,y){
  const sym=['💗','💖','💕','💘','✨','🌸','💋'],col=['#fff36b','#fff','#ff9ec6','#ffd1e6','#b40e60'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
   parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.22,r:Math.random()*6,vr:(Math.random()-.5)*.3,
    e:Math.random()<.55?sym[i%sym.length]:null,c:col[i%col.length],sz:14+Math.random()*14,life:1});}
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0&&p.y<cv.height+40);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.life-=.004;
    cx.save();cx.globalAlpha=Math.max(p.life,0);cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.e){cx.font=p.sz+'px serif';cx.fillText(p.e,0,0);}else{cx.fillStyle=p.c;cx.fillRect(-4,-2,8,5);}
    cx.restore();});
  raf=parts.length?requestAnimationFrame(loop):0;
}

/* typed love note */
const note2='Every smile, every little moment — it’s always been you. Thank you for being my home, my best friend and my forever. I love you, Nanziba. 💗';
function typeIt(){const m=$('msg');let i=0;m.textContent='';
  const t=setInterval(()=>{m.textContent=note2.slice(0,++i);if(i>=note2.length){clearInterval(t);m.innerHTML=note2+'<b>— Your Shadman 💋</b>';}},42);}

/* YES */
let said=false;
function sayYes(){
  if(said)return;said=true;
  $('question').style.display='none';layer.style.display='none';
  $('yay').style.display='flex';playMusic();
  if($('ourPhoto').complete)$('polaroid').style.display='block';
  burst(90,innerWidth/2,innerHeight*.55);
  setTimeout(()=>burst(70,innerWidth*.2,innerHeight*.5),500);
  setTimeout(()=>burst(70,innerWidth*.8,innerHeight*.5),900);
  setTimeout(()=>burst(60,innerWidth/2,innerHeight*.4),1700);
  setTimeout(typeIt,1200);
}
yes.addEventListener('click',sayYes);
$('ourPhoto').addEventListener('load',()=>{if(said)$('polaroid').style.display='block'});

/* tap anywhere = little hearts */
$('yay').addEventListener('click',e=>{
  if(e.target.id==='musicToggle')return;
  for(let i=0;i<5;i++){const h=document.createElement('span');h.className='pop';h.textContent=emo[Math.floor(Math.random()*emo.length)];
   h.style.left=e.clientX-12+'px';h.style.top=e.clientY-12+'px';h.style.setProperty('--dx',(Math.random()*120-60)+'px');
   document.body.appendChild(h);setTimeout(()=>h.remove(),1500);}
});
</script>
